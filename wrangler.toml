name = "lisap"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

# lisap.app serves the React app and API; api.lisap.app keeps working for the
# client's existing REACT_APP_API_URL. Remove the old tunnel DNS records for
# these hostnames before the first deploy.
routes = [
  { pattern = "lisap.app", custom_domain = true },
  { pattern = "www.lisap.app", custom_domain = true },
  { pattern = "api.lisap.app", custom_domain = true },
]

[assets]
directory = "./client/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/gmail/*"]

[[d1_databases]]
binding = "DB"
database_name = "lisap"
database_id = "411c31ff-4db0-4f1f-9bc1-46d6c8858df5"

[triggers]
crons = ["0 9 * * *"]   # renew the Gmail watch and clean up, daily

[vars]
GMAIL_WATCH_TOPIC = "projects/email-sms-service/topics/lisap"
FIREBASE_PROJECT_ID = "email-sms-7addc"
ALLOWED_ORIGINS = "https://lisap.app,https://www.lisap.app,http://localhost:3001"

# Secrets (set with `npx wrangler secret put NAME`):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN  - the shared LISAP Gmail account
#   FIREBASE_SERVICE_ACCOUNT  - service account JSON (or base64 of it), for sending pushes
#   PUBSUB_TOKEN              - random string; also goes on the Pub/Sub push URL as ?token=
